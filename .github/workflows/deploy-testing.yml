name: Deploy to Testing Environment

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for web (Testing)
        run: npm run build:web

      - name: Prepare testing deployment
        run: |
          echo "🧪 Preparing Testing Environment Deployment"

          # Check if dist directory exists
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found after build"
            echo "Available directories:"
            ls -la
            exit 1
          fi

          mkdir -p testing-deploy

          # Copy dist contents safely
          if [ -z "$(ls -A dist)" ]; then
            echo "❌ Error: dist directory is empty"
            exit 1
          fi

          cp -r dist/* testing-deploy/

          # Add testing environment marker
          sed -i 's/<body>/<body data-environment="testing">/' testing-deploy/index.html || true

          # Fix asset paths for testing subdirectory
          # Replace ./1x1_Trainer/ with ./  (relative to /1x1_Trainer/testing/)
          sed -i 's|"\./1x1_Trainer/|"\./|g' testing-deploy/index.html || true
          sed -i 's|href="./icon-|href="/1x1_Trainer/testing/icon-|g' testing-deploy/index.html || true

          # Fix service worker paths for testing subdirectory
          sed -i "s|'/1x1_Trainer/service-worker.js'|'/1x1_Trainer/testing/service-worker.js'|g" testing-deploy/index.html || true
          sed -i "s|scope: '/1x1_Trainer/'|scope: '/1x1_Trainer/testing/'|g" testing-deploy/index.html || true

          # Fix manifest.json paths if it exists
          if [ -f "testing-deploy/manifest.json" ]; then
            sed -i 's|1x1_Trainer/|1x1_Trainer/testing/|g' testing-deploy/manifest.json || true
          fi

          # Fix service-worker.js paths if it exists
          if [ -f "testing-deploy/service-worker.js" ]; then
            sed -i 's|/1x1_Trainer/|/1x1_Trainer/testing/|g' testing-deploy/service-worker.js || true
          fi

          echo "✅ Testing environment prepared"

      - name: Guard – keine sensiblen Dateien im Deploy-Verzeichnis
        # Ersetzt den früheren Schritt "Cleanup sensitive files from gh-pages".
        # Der hat gh-pages im Build-Workspace ausgecheckt und per `git add -A`
        # gitignorierte Build-Reste (.expo/, dist/, *-deploy/) erst eingecheckt
        # (S540d/S540d.github.io#28). Geprüft wird jetzt VOR dem Upload genau das,
        # was hochgeladen wird.
        run: |
          DIR=./testing-deploy
          BAD=$( { find "$DIR" -maxdepth 1 \( -name node_modules -o -name .expo -o -name .git \) ; \
                  find "$DIR" \( -name '.env' -o -name '.env.*' -o -name '*.jks' -o -name '*.keystore' \
                    -o -name '*.p12' -o -name credentials.json -o -name google-services.json \
                    -o -name GoogleService-Info.plist -o -name local.properties \) ; } | head -20)
          if [ -n "$BAD" ]; then
            echo "::error::Sensible Dateien im Deploy-Verzeichnis $DIR:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ Deploy-Verzeichnis $DIR sauber"

      - name: Upload to gh-pages (testing subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./testing-deploy
          destination_dir: testing
          commit_message: '🧪 Testing deployment from ${{ github.sha }}'
          keep_files: true
          allow_empty_commit: true

      - name: Deployment Summary
        run: |
          echo "🧪 Testing deployment successful!"
          echo "Testing URL: https://s540d.github.io/1x1_Trainer/testing/"
          echo "Branch: gh-pages (subdirectory: /testing/)"
          echo "Note: GitHub Pages will auto-rebuild from branch (1-2 minutes)"

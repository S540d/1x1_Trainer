name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for web
        run: npm run build:web

      - name: Prepare production deployment
        run: |
          echo "🚀 Preparing Production Deployment"

          # Check if dist directory exists
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found after build"
            echo "Available directories:"
            ls -la
            exit 1
          fi

          mkdir -p production-deploy

          # Copy dist contents safely
          if [ -z "$(ls -A dist)" ]; then
            echo "❌ Error: dist directory is empty"
            exit 1
          fi

          cp -r dist/* production-deploy/

          # Add production environment marker
          sed -i 's/<body>/<body data-environment="production">/' production-deploy/index.html || true
          echo "✅ Production environment prepared"

      - name: Guard – keine sensiblen Dateien im Deploy-Verzeichnis
        # Ersetzt den früheren Schritt "Cleanup sensitive files from gh-pages".
        # Der hat gh-pages im Build-Workspace ausgecheckt und per `git add -A`
        # gitignorierte Build-Reste (.expo/, dist/, *-deploy/) erst eingecheckt
        # (S540d/S540d.github.io#28). Geprüft wird jetzt VOR dem Upload genau das,
        # was hochgeladen wird.
        run: |
          DIR=./production-deploy
          BAD=$( { find "$DIR" -maxdepth 1 \( -name node_modules -o -name .expo -o -name .git \) ; \
                  find "$DIR" \( -name '.env' -o -name '.env.*' -o -name '*.jks' -o -name '*.keystore' \
                    -o -name '*.p12' -o -name credentials.json -o -name google-services.json \
                    -o -name GoogleService-Info.plist -o -name local.properties \) ; } | head -20)
          if [ -n "$BAD" ]; then
            echo "::error::Sensible Dateien im Deploy-Verzeichnis $DIR:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ Deploy-Verzeichnis $DIR sauber"

      - name: Upload to gh-pages (root directory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./production-deploy
          destination_dir: .
          commit_message: '🚀 Production deployment from ${{ github.sha }}'
          keep_files: true

      - name: Deployment Summary
        run: |
          echo "🚀 Production deployment successful!"
          echo "Production URL: https://s540d.github.io/1x1_Trainer/"
          echo "Branch: gh-pages (root directory)"
